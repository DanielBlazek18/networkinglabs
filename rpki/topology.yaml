name: rpki
  #mgmt:
  #network: static
  #ipv4-subnet: 172.31.0.0/24
topology:
  kinds:
    ceos:
      image: ceos:4.35.0F
    linux:
      image: nlnetlabs/routinator:latest
  nodes:
    inet-r1:
      kind: ceos
    isp:
      kind: ceos
    rpki-rp:
      kind: linux
      ports:
        - 8323:8323
        - 3323:3323
  links:
    - endpoints: ["inet-r1:eth1", "isp:eth1"]
