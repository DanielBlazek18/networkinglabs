name: bgp-otc
prefix: ""
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.5.4
  nodes:
    isp1:
      kind: linux
      binds:
        - ../bgp-otc/daemons:/etc/frr/daemons
        - ../bgp-otc/configs/isp1.cfg:/etc/frr/frr.conf
    isp2:
      kind: linux
      binds:
        - ../bgp-otc/daemons:/etc/frr/daemons
        - ../bgp-otc/configs/isp2.cfg:/etc/frr/frr.conf
    igw:
      kind: linux
      binds:
        - ../bgp-otc/daemons:/etc/frr/daemons
        - ../bgp-otc/configs/igw.cfg:/etc/frr/frr.conf
    customer:
      kind: linux
      binds:
        - ../bgp-otc/daemons:/etc/frr/daemons
        - ../bgp-otc/configs/customer.cfg:/etc/frr/frr.conf
    peer:
      kind: linux
      binds:
        - ../bgp-otc/daemons:/etc/frr/daemons
        - ../bgp-otc/configs/peer.cfg:/etc/frr/frr.conf
  links:
    - endpoints: ["isp1:eth1", "igw:eth1"]
    - endpoints: ["isp2:eth1", "igw:eth2"]
    - endpoints: ["igw:eth3", "customer:eth1"]
    - endpoints: ["igw:eth4", "peer:eth1"]