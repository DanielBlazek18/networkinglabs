frr version 10.5.4_git
frr defaults traditional
hostname customer
!
route-map PASS permit 10
exit
!
interface eth1
 description igw_eth2
 ip address 10.2.3.3/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.3/32
exit
!
router bgp 300
 bgp router-id 100.64.0.3
 neighbor 10.2.3.2 remote-as 200
 neighbor 10.2.3.2 local-role customer
 !
 address-family ipv4 unicast
  neighbor 10.2.3.2 route-map PASS in
  neighbor 10.2.3.2 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
