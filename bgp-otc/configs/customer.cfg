frr version 10.5.4_git
frr defaults traditional
hostname customer
!
route-map PASS permit 10
exit
!
ip route 192.168.4.0/24 Null0
!
interface eth1
 description igw_eth3
 ip address 10.3.4.4/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.4/32
exit
!
router bgp 65004
 bgp router-id 100.64.0.4
 neighbor 10.3.4.3 remote-as 65003
 neighbor 10.3.4.3 local-role customer
 !
 address-family ipv4 unicast
  network 192.168.4.0/24
  neighbor 10.3.4.3 route-map PASS in
  neighbor 10.3.4.3 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
