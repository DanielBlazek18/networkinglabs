frr version 10.5.4_git
frr defaults traditional
hostname peer
!
route-map PASS permit 10
exit
!
ip route 192.168.5.0/24 Null0
!
interface eth1
 description igw_eth4
 ip address 10.3.5.5/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.5/32
exit
!
router bgp 65005
 bgp router-id 100.64.0.5
 neighbor 10.3.5.3 remote-as 65003
 neighbor 10.3.5.3 local-role peer
 !
 address-family ipv4 unicast
  network 192.168.5.0/24
  neighbor 10.3.5.3 route-map PASS in
  neighbor 10.3.5.3 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
