frr version 10.5.4_git
frr defaults traditional
hostname isp
!
route-map PASS permit 10
exit
!
ip route 192.0.0.0/24 Null0
!
interface eth1
 description igw_eth1
 ip address 10.1.2.1/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.1/32
exit
!
router bgp 100
 bgp router-id 100.64.0.1
 neighbor 10.1.2.2 remote-as 200
 neighbor 10.1.2.2 local-role provider
 !
 address-family ipv4 unicast
  network 192.0.0.0/24
  neighbor 10.1.2.2 route-map PASS in
  neighbor 10.1.2.2 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
