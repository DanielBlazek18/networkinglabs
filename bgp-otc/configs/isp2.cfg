frr version 10.5.4_git
frr defaults traditional
hostname isp2
!
route-map PASS permit 10
exit
!
ip route 192.168.2.0/24 Null0
!
interface eth1
 description igw_eth2
 ip address 10.2.3.2/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.2/32
exit
!
router bgp 65002
 bgp router-id 100.64.0.2
 neighbor 10.2.3.3 remote-as 65003
 neighbor 10.2.3.3 local-role provider
 !
 address-family ipv4 unicast
  network 192.168.2.0/24
  neighbor 10.2.3.3 route-map PASS in
  neighbor 10.2.3.3 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
