frr version 10.5.4_git
frr defaults traditional
hostname igw
!
route-map PASS permit 10
exit
!
interface eth1
 description isp_Ethernet1
 ip address 10.1.2.2/24
exit
!
interface eth2
 description customer_eth1
 ip address 10.2.3.2/24
exit
!
interface lo
 description Router_ID
 ip address 100.64.0.2/32
exit
!
router bgp 200
 bgp router-id 100.64.0.2
 neighbor 10.1.2.1 remote-as 100
 neighbor 10.1.2.1 local-role customer
 neighbor 10.2.3.3 remote-as 300
 neighbor 10.2.3.3 local-role provider
 !
 address-family ipv4 unicast
  neighbor 10.1.2.1 route-map PASS in
  neighbor 10.1.2.1 route-map PASS out
  neighbor 10.2.3.3 route-map PASS in
  neighbor 10.2.3.3 route-map PASS out
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
