name: epe
prefix: "" 
topology:
  kinds:
    ceos:
      image: ceos:4.35.0F 
  nodes:
    ingress-pe:
      kind: ceos 
    bb:
      kind: ceos
    egress-pe:
      kind: ceos
    peer1:
      kind: ceos
    peer2:
      kind: ceos
  links:
    - endpoints: ["ingress-pe:eth1", "bb:eth1"]
    - endpoints: ["bb:eth2", "egress-pe:eth1"]
    - endpoints: ["egress-pe:eth2", "peer1:eth1"]
    - endpoints: ["egress-pe:eth3", "peer1:eth2"]
    - endpoints: ["egress-pe:eth4", "peer2:eth1"]
