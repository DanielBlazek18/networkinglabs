template {
   neighbor as-65001 {
        local-as 65005;
        peer-as 65001;
        router-id 100.64.0.5;
        local-address 10.1.5.5;
        flow {
            route {
                match {
                    source 9.0.0.9/32;
                    }
                    then {
                        discard;
                    }
                }
            }
        family {
            ipv4 unicast;
            ipv6 unicast;
            ipv4 flow;
        }
        capability {
            route-refresh;
            graceful-restart;
            add-path send/receive;
        }
    }
}

neighbor 10.1.5.1 {
        inherit as-65001;
}
