!
no aaa root
!
username admin privilege 15 role network-admin secret admin
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine2
ip domain lookup source-interface Management1
ip name-server vrf default 8.8.4.4
ip name-server vrf default 8.8.8.8
dns domain lab.danielblazek.cz
!
spanning-tree mode mstp
!
clock timezone Europe/Prague
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description leaf1_Ethernet1
   mtu 9202
   no switchport
   ipv6 enable
   no shutdown
!
interface Ethernet2
   description leaf2_Ethernet2
   mtu 9202
   no switchport
   ipv6 enable
   no shutdown
!
interface Ethernet3
   description leaf3_Ethernet3
   mtu 9202
   no switchport
   ipv6 enable
   no shutdown
!
interface Ethernet4
   description leaf4_Ethernet4
   mtu 9202
   no switchport
   ipv6 enable
   no shutdown
!
interface loopback0
   description RouterID
   ip address 100.64.0.2/32
   ipv6 address 2001::100:64:0:2/128
!
interface Management0
   ip address 172.20.20.3/24
   ipv6 address 3fff:172:20:20::3/64
!
ip routing ipv6 interface
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 100.64.0.0/24 eq 32
   seq 20 permit 100.65.0.0/24 eq 32
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 4200000000
   router-id 100.64.0.2
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password LAB
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password LAB
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 100.64.0.3 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.3 remote-as 4200000003
   neighbor 100.64.0.3 description leaf1_Loopback0
   neighbor 100.64.0.4 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.4 remote-as 4200000004
   neighbor 100.64.0.4 description leaf2_Loopback0
   neighbor 100.64.0.5 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.5 remote-as 4200000005
   neighbor 100.64.0.5 description leaf3_Loopback0
   neighbor 100.64.0.6 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.6 remote-as 4200000006
   neighbor 100.64.0.6 description leaf4_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   neighbor interface Ethernet1 peer-group IPv4-UNDERLAY-PEERS remote-as 4200000003
   neighbor interface Ethernet2 peer-group IPv4-UNDERLAY-PEERS remote-as 4200000004
   neighbor interface Ethernet3 peer-group IPv4-UNDERLAY-PEERS remote-as 4200000005
   neighbor interface Ethernet4 peer-group IPv4-UNDERLAY-PEERS remote-as 4200000006
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      host-flap detection expiry timeout 300.0 seconds
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS next-hop address-family ipv6 originate
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end