ip name-server vrf default 8.8.8.8
ip name-server vrf default 8.8.4.4
ip domain lookup source-interface Management1
dns domain lab.danielblazek.cz
!
interface loopback0
   description RouterID
   ip address 100.64.0.4/32
!
interface loopback1
   description VTEP
   ip address 100.65.0.4/32
!
interface Ethernet1
   no switchport
   description spine1_Ethernet2
   mtu 9202
   ip address 10.1.4.4/24
   no shutdown
!
interface Ethernet2
   no switchport
   description spine2_Ethernet2
   mtu 9202
   ip address 10.2.4.4/24
   no shutdown
!
interface Ethernet3
   description host1
   no shutdown
   channel-group 1 mode active
!
interface Port-Channel1
   description host1_Ethernet1
   no shutdown
   switchport trunk native vlan 1000
   switchport trunk allowed vlan none
   switchport mode trunk
   switchport
   !
   evpn ethernet-segment
      identifier 0000:0000:beee:0001:0001
      route-target import be:ee:00:01:00:01
   lacp system-id 0a:00:ca:fe:00:01
   no shutdown
!
ip virtual-router mac-address 0a:00:ca:fe:00:01
ip routing
router bgp 4200000004
   router-id 100.64.0.4
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password LAB
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password LAB
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 100.64.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.1 remote-as 4200000000
   neighbor 100.64.0.1 description spine1_Loopback0
   neighbor 100.64.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 100.64.0.2 remote-as 4200000000
   neighbor 100.64.0.2 description spine2_Loopback0
   neighbor 10.1.4.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.4.1 remote-as 4200000000
   neighbor 10.1.4.1 description spine1_Ethernet2
   neighbor 10.2.4.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.2.4.2 remote-as 4200000000
   neighbor 10.2.4.2 description spine2_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      host-flap detection window 180 threshold 5 expiry timeout 300 seconds
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 100.64.0.0/23 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!

