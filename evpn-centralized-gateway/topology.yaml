name: evpn-centralized-gateway
prefix: ""
topology:
  kinds:
    ceos:
      image: ceos:4.35.0F 
  nodes:
    spine1:
      kind: ceos
    spine2:
      kind: ceos
    leaf1:
      kind: ceos
    leaf2:
      kind: ceos
    leaf3:
      kind: ceos
    host1:
      kind: ceos
    host2:
      kind: ceos
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host1:eth2"]
    - endpoints: ["leaf3:eth3", "host2:eth1"]